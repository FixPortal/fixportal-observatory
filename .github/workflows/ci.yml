name: CI

on:
  # Deliberately narrow: all-branch pushes fire a second full run on every PR commit.
  # Concurrency does not safely solve that because push and PR refs differ.
  # Regression signal: two runs with one head SHA, one push and one pull_request.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint workflows (actionlint)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: true

  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        # Pull from the AWS ECR Public mirror of the Docker official image, not
        # Docker Hub directly. The service-container pull is run by the runner
        # (we can't add our own retries to it), and Docker Hub periodically
        # times out / throttles GitHub runners ("registry-1.docker.io: context
        # deadline exceeded"), failing CI before Build/Test ever run. The ECR
        # Public mirror is the same image with anonymous, un-throttled pulls.
        # PINNED BY DIGEST, not by the `:16` tag. A service image runs code in the
        # runner's context exactly as an action does, and a mutable tag can change after
        # review -- the 2026-09-02 estate audit raised this alongside the equivalent
        # mssql pin in fixportal-service-centerprise.
        #
        # Refresh deliberately: Dependabot does NOT update service-container images in
        # workflows, so unlike a Dockerfile FROM nothing will nudge this. Get a token from
        # public.ecr.aws/token/?scope=repository:docker/library/postgres:pull, HEAD
        # /v2/docker/library/postgres/manifests/16 with an OCI/Docker manifest-list Accept
        # header, and read Docker-Content-Digest. Resolved from `:16` on 2026-09-02.
        image: public.ecr.aws/docker/library/postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_DB: aiobs_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Check C# formatting
        run: dotnet csharpier check .

      - name: Restore
        run: dotnet restore AiObservatory.slnx

      - name: Build
        run: dotnet build AiObservatory.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution AiObservatory.slnx --configuration Release --no-build --report-xunit-trx --results-directory ./TestResults --timeout 5m
        env:
          TEST_DB_CONNECTION: "Host=localhost;Database=aiobs_test;Username=postgres;Password=postgres"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  build-web:
    name: Frontend (UI)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/AiObservatory.Web

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/AiObservatory.Web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The repository carries three node:test suites that no job ran, so none of them could fail a
  # pull request. That mattered most for public-restore-contract, which is the only guard against
  # silently reintroducing the private NuGet feed a public consumer cannot restore from: a
  # regression would have shipped green. They cannot ride in build-web — that job runs from
  # src/AiObservatory.Web, and vitest's include pattern cannot reach a root-level .mjs.
  contract-tests:
    name: Contract tests (node:test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          # public-restore-contract performs a real cold restore and inspects tracked files via
          # git, so it needs the checkout to be a working repository, not just a file tree.
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Files named explicitly, not directories: `node --test <dir>` resolves the argument as a
      # module and fails with MODULE_NOT_FOUND. This is also the invocation the README and
      # CONTRIBUTING document, so the two cannot drift.
      - name: Repository contract suites
        run: >-
          node --test
          tests/docs-contract.test.mjs
          tests/public-restore-contract.test.mjs
          clients/observatory-sweep.test.mjs

  gate-coverage:
    name: Gate coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert every job in this workflow is gated
        env:
          # deploy runs AFTER ci-gate rather than feeding it, so it cannot be in the
          # gate's needs: without a cycle. It is not a quality check and must not be
          # merge-blocking -- it is the consequence of a merge, not a condition of one.
          GATE_EXEMPT: 'deploy'
        run: python3 .github/scripts/assert_gate_coverage.py .github/workflows/ci.yml

  # Required status check. Deliberately a pure aggregator of needs.*.result: it decides
  # what can merge, so it has no checkout, no parser and no network of its own.
  #
  # `if: always()` is load-bearing. Without it the job is SKIPPED when an upstream job
  # fails, a skipped job emits no check run at all, and a required context that never
  # reports leaves the pull request permanently unmergeable.
  #
  # `skipped` counts as a pass, which is what lets job-level `if:` conditions and path
  # filtering work; `failure` and `cancelled` do not.
  ci-gate:
    name: CI Gate
    if: always()
    needs: [workflow-lint, backend, build-web, contract-tests, gate-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if any upstream job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "Upstream results: ${{ join(needs.*.result, ', ') }}"
          exit 1

  # Production deployment, called rather than separately triggered.
  #
  # deploy.yml used to run `on: workflow_run: [CI]`. That is a privileged trigger --
  # it executes in the base repository's context with its secrets -- and this
  # repository is PUBLIC, so anyone can open the pull request that probes it. Calling
  # the workflow from here removes the trigger entirely rather than mitigating it.
  #
  # `needs: [ci-gate]` preserves what workflow_run was actually buying: the deployment
  # runs only after CI passed ON THIS COMMIT. A plain `on: push` would have lost that,
  # because this estate rebase-merges and the merged SHA is one CI never saw as a pull
  # request head.
  #
  # `if:` restricts it to a push on main, so pull request runs of this workflow -- fork
  # ones included -- skip it and never reach the deployment secrets.
  deploy:
    name: Deploy
    needs: [ci-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    permissions:
      contents: read
      # The CALLER's permissions are the ceiling for the called workflow: a job in
      # deploy.yml asking for id-token: write is denied it unless it is granted here
      # too. Without this, azure/login fails to obtain an OIDC token and the failure
      # points at the called workflow rather than at this line.
      id-token: write
